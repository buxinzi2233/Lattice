name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.31"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra build
      - run: uv run python -m build
      - run: sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          body_path: docs/release-notes-v0.2.0-en.md

  windows-portable:
    runs-on: windows-latest
    needs: source
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.31"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra build
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_portable_windows.ps1
      - name: Smoke test portable executable
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\smoke_portable_windows.ps1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/Lattice-0.2.0-windows-portable.zip
            dist/SHA256SUMS-windows.txt

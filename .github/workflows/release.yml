name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra build
      - name: Check release version
        run: uv run python -c 'import os, importlib.metadata; assert os.environ["GITHUB_REF_NAME"] == "v" + importlib.metadata.version("tooldeck"), "Tag and project version differ"'
      - run: uv run python -m build
      - name: Checksum source packages
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt

  publish:
    runs-on: ubuntu-latest
    needs: [verify, source]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS*.txt

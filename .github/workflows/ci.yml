name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.31"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: uv run pytest -q
      - name: QML lint
        if: runner.os == 'Linux'
        run: uv run pyside6-qmllint src/tooldeck/gui/qml/Main.qml src/tooldeck/gui/qml/components/*.qml

  windows-portable:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.31"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Windows installer and shortcut
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\verify_windows_install.ps1
      - run: uv sync --frozen --extra dev --extra build
      - run: uv run python -m build
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_portable_windows.ps1
      - name: Smoke test portable executable
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\smoke_portable_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: lattice-windows-portable
          path: |
            dist/Lattice-0.2.0-windows-portable.zip
            dist/SHA256SUMS-windows.txt
